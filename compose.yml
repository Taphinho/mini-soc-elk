name: mini-soc

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:?Définir STACK_VERSION dans .env}
    restart: "no"

    environment:
      ELASTIC_PASSWORD_FILE: /run/secrets/elastic_password
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"

    mem_limit: 3g
    cpus: 2.0

    ports:
      - "127.0.0.1:9200:9200"

    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./configs/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - ./docker/certs/elasticsearch:/usr/share/elasticsearch/config/certs:ro

    secrets:
      - elastic_password

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --silent --show-error
          --cacert config/certs/ca.crt
          --output /dev/null --write-out '%{http_code}'
          https://localhost:9200 | grep -qx '401'
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  elastic_password:
    file: ./configs/secrets/elastic_password

volumes:
  es_data:
